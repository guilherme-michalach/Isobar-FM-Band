server:
  port: 8080

spring:
  application:
    name: demo
  cache:
    caffeine:
      spec: maximumSize=500,expireAfterWrite=10m

bands:
  api:
    url: https://bands-api.vercel.app/api/bands
    connection-timeout: 5000
    read-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,caches,metrics
  endpoint:
    health:
      show-details: always